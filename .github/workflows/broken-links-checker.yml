name: Broken Links Checker

on:
  # Schedule: Run every Monday at 9 AM IST (3:30 AM UTC)
  schedule:
    - cron: '30 3 * * 1'  # Every Monday at 9 AM IST (3:30 AM UTC)

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

  # Optional: Run on push to main (for testing)
  # push:
  #   branches: [ main ]

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for git operations

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

    - name: Create .env file from secrets
      run: |
        cat > .env << EOF
        # Broken Link Checker Configuration

        # Documentation URLs to check (comma-separated)
        DOCS_URLS=${{ secrets.DOCS_URLS }}

        # Crawl Settings
        MAX_CRAWL_DEPTH=4
        MAX_PAGES_PER_SITE=0
        MAX_LINKS_TO_CHECK=0
        FOLLOW_EXTERNAL_LINKS=false
        CHECK_EXTERNAL_LINKS=false
        REQUEST_TIMEOUT_SECONDS=10
        PARALLEL_WORKERS=100

        # Exclude Patterns (regex, comma-separated)
        EXCLUDE_PATTERNS=${{ secrets.EXCLUDE_PATTERNS }}

        # Notification Settings
        ENABLE_DESKTOP_NOTIFICATIONS=false
        ENABLE_SLACK_NOTIFICATIONS=false
        NOTIFICATION_SOUND=Glass

        # Slack Settings
        SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_CHANNEL=#tech-writers-india

        # GitHub Pages Settings
        ENABLE_GITHUB_UPLOAD=true
        GITHUB_REPO_NAME=broken-links-reports
        GITHUB_USERNAME=${{ secrets.PAGES_USERNAME }}

        # Alert Thresholds
        MIN_BROKEN_LINKS_FOR_ALERT=1
        NOTIFY_ON_COMPLETION=true

        # Scheduled Mode
        CHECK_INTERVAL_HOURS=24
        EOF

    - name: Run broken links checker
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      run: |
        python3 enhanced_link_checker.py

    - name: Upload reports as artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: broken-links-reports
        path: reports/
        retention-days: 30

    - name: Upload logs as artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: link_checker_enhanced.log
        retention-days: 7
